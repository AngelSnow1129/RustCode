[package]
name = "rustcode-clix"
version.workspace = true
edition = "2021"
description = "Standalone new-stack CLI (D-layer driver): `code` drives the full coding agent (prepare/assemble), `review` drives the rustcode-review agent over a git diff. Decoupled from rustcode-cli / rustcode-core."

[[bin]]
name = "rustcodex"
path = "src/main.rs"

[dependencies]
rustcode-review = { path = "../rustcode-review" }
rustcode-coding = { path = "../rustcode-coding", features = ["atomgit"] }
# Direct dep for the D-layer pieces the driver owns: MemoryStore (slash commands),
# the typed approval wire contract, SessionManager (session listing).
rustcode-capabilities = { path = "../rustcode-capabilities", features = ["provider", "tools", "session", "memory", "mcp", "atomgit"] }
rustcode-kernel = { path = "../rustcode-kernel" }
rustcode-config = { path = "../rustcode-config" }
# Standalone telemetry sink (clix is core-decoupled, so it resolves + inits its own,
# mirroring rustcode-cli) — feeds LlmChat/ToolCall events for both subcommands.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "signal", "time"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
# Capturable in-memory telemetry sink + a canned provider stream for the metering test.
futures = "0.3"
async-trait = "0.1"
