[package]
name = "rustcode-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "rustcode_daemon"
path = "src/lib.rs"

[[bin]]
name = "rustcode-daemon"
path = "src/main.rs"

[features]
default = []

[dependencies]
# Config system used directly by the daemon.
rustcode-config = { path = "../rustcode-config" }
# `tools` is required directly by the `/fs/search` handler (the `file_index`
# module is gated on it). Declare it so the dependency is explicit.
rustcode-capabilities = { path = "../rustcode-capabilities", features = ["plugin", "mcp", "tools", "egress"] }
# Unified native runtime used by daemon live/chat/session paths.
rustcode-kernel = { path = "../rustcode-kernel" }
rustcode-coding = { path = "../rustcode-coding" }

# HTTP
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.5", features = ["cors"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# WebUI static embedding.
#
# `debug-embed` makes debug builds embed too. Without it rust-embed reads
# `webui/dist/` off disk at runtime in debug, using the absolute path recorded
# at compile time — so a debug binary is bound to the machine and checkout it
# was built in, serves 404 the moment the tree moves, and cannot be handed to
# anyone. Embedding always costs ~700 KB in the debug binary and means a
# frontend change needs a Rust rebuild; `RUSTCODE_WEBUI_DEV=http://localhost:5173`
# (see `webui.rs`) is the intended fast loop for frontend work and is unaffected.
rust-embed = { version = "8", features = ["mime-guess", "debug-embed"] }
mime_guess = "2"

# Async trait support
async-trait = "0.1"

# Utils
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
tokio-util = "0.7"
regex = "1"
tracing = "0.1"
sha2 = "0.10"
# 远程访问二维码（/tunnel/status 的 SVG）
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[dev-dependencies]
# Redirect RUSTCODE_HOME to a throwaway temp dir before any test runs (via a
# #[ctor] in the lib's #[cfg(test)] module) so tests never persist into the
# developer's real ~/.rustcode.
rustcode-kernel = { path = "../rustcode-kernel", features = ["test-support"] }
# test-util unlocks reset_offline_verdict_for_test / seed_offline_verdict for
# the daemon parity test (offline block in build_api_system_prompt).
rustcode-config = { path = "../rustcode-config", features = ["test-util"] }
serial_test = "3"
ctor = "0.2"
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
