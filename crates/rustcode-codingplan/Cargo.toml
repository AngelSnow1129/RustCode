[package]
name = "rustcode-codingplan"
version.workspace = true
edition.workspace = true
description = "Managed CodingPlan gateway integration — claim / status / usage / setup REST business layer. Leaf crate: depends only on config/auth leaves + reqwest. Request-signing lives in rustcode-auth::gateway_crypto."
publish = false

[features]
default = []
# Network gateway client + claim/login/sync setup orchestration. Off by
# default in the platform-neutral fork: the pure data/usage/marker modules
# (`types`, `usage`, `sync_marker`) still build so the TUI can render usage
# shapes, but no reqwest gateway `Client` is linked. Official builds turn
# this on via the `codingplan` feature of the driver crates.
client = ["dep:reqwest"]

[dependencies]
rustcode-config    = { path = "../rustcode-config" }
rustcode-auth      = { path = "../rustcode-auth" }
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"], default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[target.'cfg(target_os = "windows")'.dependencies]
# Windows SChannel backend for reqwest (dodges rustls-fingerprint / TLS RST
# resets seen behind certain TLS middleboxes in front of some managed gateways).
reqwest = { version = "0.12", features = ["native-tls"], default-features = false, optional = true }

[dev-dependencies]
# The moved unit tests build a throwaway home dir for config/auth isolation.
tempfile = "3"
