[package]
name = "rustcode-codingplan"
version.workspace = true
edition.workspace = true
description = "AtomGit CodingPlan gateway integration — claim / status / usage / setup REST business layer. Leaf crate: depends only on config/auth leaves + reqwest, never rustcode-core. Request-signing lives in rustcode-auth::gateway_crypto."
publish = false

[dependencies]
rustcode-config    = { path = "../rustcode-config" }
rustcode-auth      = { path = "../rustcode-auth" }
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[target.'cfg(target_os = "windows")'.dependencies]
# Windows SChannel backend for reqwest (dodges rustls-fingerprint RST on api.gitcode.com).
reqwest = { version = "0.12", features = ["native-tls"], default-features = false }

[dev-dependencies]
# The moved unit tests build a throwaway home dir for config/auth isolation.
tempfile = "3"
