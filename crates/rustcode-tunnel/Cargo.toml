[package]
name = "rustcode-tunnel"
version.workspace = true
edition = "2021"
description = "Minimal self-hosted frp-style reverse tunnel: shared wire protocol, daemon client (frpc) and relay server (frps)."
publish = false

[dependencies]
anyhow = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tracing = "0.1"
