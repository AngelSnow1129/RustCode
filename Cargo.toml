[workspace]
resolver = "2"
# Any crate dropped into `crates/` is picked up with no toml edit.
members = ["crates/*"]
default-members = [
    "crates/rustcode-cli",
    "crates/rustcode-daemon",
    "crates/rustcode-tuix",
    # 自带中继二进制 rustcode-relay：加入 default-members，让 `cargo build --release`
    # 直接产出它（否则需要 -p rustcode-tunnel，用户很容易漏掉）。lib 本身已随
    # daemon 依赖编译，这里只多编译一个 bin，增量成本很小。
    "crates/rustcode-tunnel",
]

[profile.release]
opt-level = "z"        # Optimize for size
lto = true             # Link-time optimization — eliminates dead code across crates
codegen-units = 1      # Single codegen unit — better optimization, slower build
strip = true           # Strip symbols automatically
panic = "abort"        # Remove panic unwinding code — saves ~200-500KB

[profile.test]
debug = "line-tables-only" # Smaller binaries, faster linker

[workspace.package]
version = "6.2.1"
edition = "2021"
license = "MIT"
repository = "https://gitcode.com/SecLab/RustCode"
description = "Open-source terminal AI coding agent"

[workspace.dependencies]
agent-client-protocol = "=2.0.0"
anyhow = "1"
similar = "2"
