[workspace]
resolver = "2"
# Glob picks up the closed-source `rustcode-codingplan-crypto` overlay
# the official build pipeline drops into `crates/` (see the stub at
# `crates/rustcode-codingplan-crypto/`). Adding any future crate is also
# a no-toml-edit operation.
members = ["crates/*"]
# `rustcode-codingplan-crypto` is intentionally absent from default-members:
# the stub is wired into rustcode-auth via an optional dep behind the
# final binary's `codingplan-crypto` feature, so a default `cargo build`
# from the workspace root has no reason to compile it. The official build
# picks it up explicitly via `--features rustcode/codingplan-crypto`.
default-members = [
    "crates/rustcode-cli",
    "crates/rustcode-daemon",
    "crates/rustcode-tuix",
]

[profile.release]
opt-level = "z"        # Optimize for size
lto = true             # Link-time optimization — eliminates dead code across crates
codegen-units = 1      # Single codegen unit — better optimization, slower build
strip = true           # Strip symbols automatically
panic = "abort"        # Remove panic unwinding code — saves ~200-500KB

[profile.test]
debug = "line-tables-only" # Smaller binaries, faster linker

[workspace.package]
version = "5.0.9"
edition = "2021"
license = "MIT"
repository = "https://example.com/your-org/rustcode"
description = "Open-source terminal AI coding agent"

[workspace.dependencies]
agent-client-protocol = "=2.0.0"
anyhow = "1"
similar = "2"
