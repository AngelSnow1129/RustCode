version: "1.0"
name: RustCode 构建与发布
displayName: RustCode 构建与发布
stages:
- name: 构建
  displayName: 构建
  strategy: naturally
  trigger: auto
  steps:
  # ── 1) 前端 WebUI 构建：必须在 Rust 编译之前，二进制编译期嵌入 webui/dist ──
  # build@rust 镜像不含 node/npm，故单独用 node 镜像步骤。
  - step: shell@1
    name: webui
    displayName: WebUI 前端构建 (npm ci + build)
    image: node:22-bullseye      # webui/package.json engines.node 要求 >=22.6
    commands:
    - |
      set -eu
      cd webui
      npm ci
      npm run build
      cd ..
  # ── 2) Rust 多架构交叉构建 ──
  - step: build@rust
    name: cross
    displayName: Rust 多架构交叉构建 (linux-x64 / linux-arm64 / windows-x64)
    rustVersion: "1.88"
    commands:
    - |
      set -eu
      # cross-build.sh 统一处理：musl 静态链接 linux-x64/arm64 + mingw 交叉 windows-x64，
      # 产物落 dist/<version>/ 并生成 sha256sums.txt。
      # macOS(darwin) 需专有 SDK，Gitee Linux Runner 无法构建，由 GitHub Actions 单独产出。
      bash scripts/cross-build.sh
    artifacts:
    - name: BUILD_ARTIFACT
      path:
      - ./dist
      type: .tar.gz
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "4"
        memory: "8"
- name: 发布
  displayName: 发布
  strategy: naturally
  trigger: auto
  steps:
  - step: shell@1
    name: publish
    displayName: 上传 GitCode Release 多架构资产
    # 关键：必须显式取回构建产物，否则跨 stage 后 dist/ 不在工作区，会发布空 Release。
    upstreamArtifact:
    - BUILD_ARTIFACT
    commands:
    - |
      set -eu
      VERSION=$(awk -F'"' '/^version[[:space:]]*=/{print $2; exit}' Cargo.toml)
      TAG="v${VERSION}"
      DIST="dist/${TAG}"

      echo "=== Uploading ${TAG} release assets (commit ${CI_COMMIT_SHA:-unknown}) ==="
      echo "DIST=${DIST}"

      # 产物必须通过 upstreamArtifact 取得，否则此处目录不存在。
      if [ ! -d "${DIST}" ]; then
        echo "[ERROR] ${DIST} not found. Was BUILD_ARTIFACT passed via upstreamArtifact?" >&2
        exit 1
      fi

      # 上传每个二进制资产（sha256sums.txt 最后单独传）
      found=0
      for BIN in "${DIST}"/*; do
        [ -f "$BIN" ] || continue
        NAME=$(basename "$BIN")
        [ "$NAME" = "sha256sums.txt" ] && continue
        echo "[*] Uploading ${NAME}..."
        python3 scripts/gitcode_release.py \
          --tag-name "${TAG}" \
          --attach "${BIN}" \
          --file-name "${NAME}" \
          --target-commitish "${CI_COMMIT_SHA:-}"
        found=1
      done

      # 没有任何二进制就拒绝创建“空 Release”，避免静默成功。
      if [ "$found" -eq 0 ]; then
        echo "[ERROR] No binaries found in ${DIST}; refusing to create an empty release." >&2
        exit 1
      fi

      if [ -f "${DIST}/sha256sums.txt" ]; then
        echo "[*] Uploading sha256sums.txt..."
        python3 scripts/gitcode_release.py \
          --tag-name "${TAG}" \
          --attach "${DIST}/sha256sums.txt" \
          --file-name "sha256sums.txt" \
          --target-commitish "${CI_COMMIT_SHA:-}"
      fi

      echo "=== Release ${TAG} upload complete ==="
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
triggers:
  trigger: manual
notify: []
strategy:
  blocking: true
