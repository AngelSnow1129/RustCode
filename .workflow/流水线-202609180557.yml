version: "1.0"
name: RustCode 构建与发布
displayName: RustCode 构建与发布
stages:
- name: 构建
  displayName: 构建
  strategy: naturally
  trigger: auto
  steps:
  - step: build@rust
    name: ""
    displayName: Rust 多架构交叉构建 (linux-x64 / linux-arm64 / windows-x64)
    rustVersion: "1.88"
    commands:
    - |
      set -eu
      # WebUI 前端构建(webui/dist 被 gitignore,必须先构建否则二进制 /webui 返回 404)
      cd webui
      npm ci
      npm run build
      cd ..
      # 多架构交叉构建:统一由 scripts/cross-build.sh 处理
      #   - 工具链安装(musl-tools / musl.cc / mingw-w64)
      #   - rustup target add
      #   - cargo build --release --target <TRIPLE>
      #   - strip + sha256sums.txt
      # macOS 走 GitHub Actions macos-latest(Linux 交叉需专有 SDK)
      bash scripts/cross-build.sh
    artifacts:
    - name: BUILD_ARTIFACT
      path:
      - ./dist
      type: .tar.gz
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "4"
        memory: "8"
- name: 发布
  displayName: 发布
  strategy: naturally
  trigger: auto
  steps:
  - step: shell@1
    name: ""
    displayName: 上传 GitCode Release 多架构资产
    commands:
    - |
      set -eu
      VERSION=$(awk -F'"' '/^version[[:space:]]*=/{print $2; exit}' Cargo.toml)
      TAG="v${VERSION}"
      DIST="dist/${TAG}"

      echo "=== Uploading ${TAG} release assets ==="

      # 上传每个二进制资产
      for BIN in "${DIST}"/*; do
        [ -f "$BIN" ] || continue
        NAME=$(basename "$BIN")
        # checksums 文件最后上传
        [ "$NAME" = "sha256sums.txt" ] && continue
        echo "[*] Uploading ${NAME}..."
        python3 scripts/gitcode_release.py \
          --tag-name "${TAG}" \
          --attach "${BIN}" \
          --file-name "${NAME}"
      done

      # 上传校验文件
      if [ -f "${DIST}/sha256sums.txt" ]; then
        echo "[*] Uploading sha256sums.txt..."
        python3 scripts/gitcode_release.py \
          --tag-name "${TAG}" \
          --attach "${DIST}/sha256sums.txt" \
          --file-name "sha256sums.txt"
      fi

      echo "=== Release ${TAG} upload complete ==="
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
triggers:
  trigger: manual
notify: []
strategy:
  blocking: true
