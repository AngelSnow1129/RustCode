name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Branch protection: main is a mirror of dev only.
  # Direct commits to main are prohibited; all development must happen on dev.
  # This job verifies that main has no commits outside the dev branch history.
  branch-protection:
    name: main branch protection
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify main has no commits outside dev
        run: |
          git fetch origin dev
          # main must be a subset of dev (no independent commits)
          ahead=$(git rev-list --count origin/dev..HEAD)
          if [ "$ahead" -gt 0 ]; then
            echo "::error::main branch has $ahead commit(s) not in dev -- direct modifications to main are prohibited"
            echo ""
            echo "main is a mirror of dev; all development must happen on the dev branch."
            echo "To fix: move these commits to dev, then sync main from dev:"
            echo "  git checkout dev && git cherry-pick <commit-sha>"
            echo "  git push origin dev"
            echo "  git checkout main && git merge dev --ff-only"
            echo "  git push origin main"
            exit 1
          fi
          echo "[OK] main has no commits outside dev"

  release-gate:
    name: release artifact gate
    runs-on: ubuntu-latest
    # dev only, deliberately. main is a mirror of dev and must never receive an
    # independent change -- including an artifact-only one -- so this gate is
    # never widened to main. Sync path stays: dev -> main fast-forward only.
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Guard rail: if someone later widens the `if` above, fail loudly instead of
      # letting this job silently run against main.
      - name: Assert this job never runs against main
        run: |
          if [ "${GITHUB_REF:-}" = "refs/heads/main" ]; then
            echo "::error::release-gate must never run on main (main is a mirror of dev)"
            exit 1
          fi
      # Same predicate as the local pre-push hook, so `git push --no-verify`
      # cannot land an artifact-less commit on dev either. `--target any`
      # because the runner is not the host that pushed (see the script header).
      - name: Verify a committed release artifact exists for this version
        run: bash scripts/prepush-release-check.sh --sha "$GITHUB_SHA" --target any

  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    env:
      # Known-red allowlist -- see AGENTS.md:226.
      # `project_trust_key` is computed with `std::collections::hash_map::DefaultHasher`,
      # whose output is NOT guaranteed stable across toolchains, so this test is red
      # by design. Do NOT edit the test or the golden value just to go green.
      # The job passes only when every failing test is on this list; any NEW failure
      # fails the job (no `continue-on-error`, no `#[ignore]` -- no silent degradation).
      KNOWN_RED_TESTS: "mcp::registry::tests::trust_key_golden_matches_core_algorithm"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: run workspace tests (allowlist-guarded)
        run: |
          set +e
          cargo test --workspace --no-fail-fast > /tmp/cargo-test.log 2>&1
          cargo_status=$?
          set -e
          cat /tmp/cargo-test.log
          if [ "$cargo_status" -eq 0 ]; then
            echo "[OK] all workspace tests passed; allowlist not needed"
            exit 0
          fi
          # Collect failing test names from the `failures:` summary blocks.
          failed=$(awk '/^failures:$/{f=1;next} /^test result:/{f=0} f&&/^    [A-Za-z_]/{print $1}' /tmp/cargo-test.log | sort -u)
          if [ -z "$failed" ]; then
            echo "::error::cargo test exited $cargo_status but no failing test name could be parsed; treating as a real regression"
            exit 1
          fi
          echo "--- failing tests ---"
          echo "$failed"
          unexpected=""
          for name in $failed; do
            case " $KNOWN_RED_TESTS " in
              *" $name "*) echo "[known-red] $name" ;;
              *) unexpected="$unexpected $name" ;;
            esac
          done
          if [ -n "$unexpected" ]; then
            echo "::error::unexpected test failure(s):$unexpected -- this is a regression"
            exit 1
          fi
          echo "[OK] only known-red test(s) failed; job passes"

  # G6: Zero telemetry SDK check -- ensures no Sentry/PostHog/Segment/GA/etc.
  # tracking SDKs are introduced into the codebase (see AGENTS.md OBJECTIVE-2).
  no-telemetry:
    name: G6 - no telemetry SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for telemetry SDKs in Rust source
        run: |
          # Match telemetry SDK names precisely, avoiding false positives from
          # common words like "segment" (path segment) or "amplitude" (audio).
          # - sentry: SDK crate/dependency, not the English word
          # - posthog, mixpanel: unambiguous product names
          # - @segment/analytics or segment.io: the analytics SDK, not "segment"
          # - google-analytics, googletagmanager, gtag: GA family
          hits=$(grep -riE "sentry_(crash|event|init)|posthog|@segment/analytics|segment\.io|google-analytics|googletagmanager|gtag\(|mixpanel|amplitude_(init|track|log)" \
              --include="*.rs" --include="*.toml" crates/ || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Telemetry SDK reference found in Rust source or Cargo.toml"
            exit 1
          fi
          echo "[OK] no telemetry SDK references in Rust source"
      - name: Check for telemetry SDKs in package.json
        run: |
          for f in $(find . -name "package.json" -not -path "*/node_modules/*"); do
            if grep -qE '"(sentry|posthog|@segment/analytics|mixpanel|amplitude|@amplitude)"' "$f"; then
              echo "::error::Telemetry SDK dependency found in $f"
              exit 1
            fi
          done
          echo "[OK] no telemetry SDK dependencies in package.json files"

  # G4: Headless smoke test -- drives `rustcode -p` in offline mode.
  # Requires a debug build of the CLI binary. Network-dependent tests are
  # skipped when RUSTCODE_TEST_PROVIDER is unset (default in CI).
  headless-smoke:
    name: G4 - headless smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI binary
        run: cargo build -p rustcode
      - name: Run headless smoke tests
        run: ./scripts/test-headless.sh

  # G5: ACP stdio smoke test -- drives `rustcode acp` over stdin/stdout.
  # Uses the same debug binary built above. Hermetic: fresh RUSTCODE_HOME.
  acp-smoke:
    name: G5 - ACP smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI binary
        run: cargo build -p rustcode
      - name: Run ACP smoke test
        run: python3 scripts/acp_smoke.py

  # G7/G8: No stale atomcode naming -- ensures the rename to rustcode-* is complete
  # (see AGENTS.md OBJECTIVE-1). Historical references in docs describing the
  # retired core are exempt and must be verified manually.
  no-stale-naming:
    name: G7/G8 - no stale atomcode naming
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check crates/scripts for atomcode references
        run: |
          if grep -rni "atomcode" crates/ scripts/ --include="*.rs" --include="*.sh" --include="*.toml" --include="*.py"; then
            echo "::error::Stale 'atomcode' reference found in crates/scripts"
            exit 1
          fi
          echo "[OK] no stale atomcode references in crates/scripts"
      - name: Check docs/architecture.md for atomcode references
        run: |
          if grep -rni "atomcode" docs/architecture.md 2>/dev/null; then
            echo "::error::Stale 'atomcode' reference found in docs/architecture.md"
            exit 1
          fi
          echo "[OK] no stale atomcode references in docs/architecture.md"
