name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # TODO: tighten to "-- -D warnings" once the ~420 existing clippy warnings are cleaned up
      - run: cargo clippy --workspace --all-targets

  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    env:
      # Known-red allowlist -- see AGENTS.md:226.
      # `project_trust_key` is computed with `std::collections::hash_map::DefaultHasher`,
      # whose output is NOT guaranteed stable across toolchains, so this test is red
      # by design. Do NOT edit the test or the golden value just to go green.
      # The job passes only when every failing test is on this list; any NEW failure
      # fails the job (no `continue-on-error`, no `#[ignore]` -- no silent degradation).
      KNOWN_RED_TESTS: "mcp::registry::tests::trust_key_golden_matches_core_algorithm"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: run workspace tests (allowlist-guarded)
        run: |
          set +e
          cargo test --workspace --no-fail-fast > /tmp/cargo-test.log 2>&1
          cargo_status=$?
          set -e
          cat /tmp/cargo-test.log
          if [ "$cargo_status" -eq 0 ]; then
            echo "[OK] all workspace tests passed; allowlist not needed"
            exit 0
          fi
          # Collect failing test names from the `failures:` summary blocks.
          failed=$(awk '/^failures:$/{f=1;next} /^test result:/{f=0} f&&/^    [A-Za-z_]/{print $1}' /tmp/cargo-test.log | sort -u)
          if [ -z "$failed" ]; then
            echo "::error::cargo test exited $cargo_status but no failing test name could be parsed; treating as a real regression"
            exit 1
          fi
          echo "--- failing tests ---"
          echo "$failed"
          unexpected=""
          for name in $failed; do
            case " $KNOWN_RED_TESTS " in
              *" $name "*) echo "[known-red] $name" ;;
              *) unexpected="$unexpected $name" ;;
            esac
          done
          if [ -n "$unexpected" ]; then
            echo "::error::unexpected test failure(s):$unexpected -- this is a regression"
            exit 1
          fi
          echo "[OK] only known-red test(s) failed; job passes"
