name: build

# 路径 B：在 GitHub Actions 上按 Tag 触发，构建 macOS / Linux / Windows 三个平台
# （每平台 2 架构，共 6 个二进制），统一创建 GitHub Release 并上传全部产物
# （零自定义 Secret，用默认 GITHUB_TOKEN + permissions: contents: write）。
#
# 原 GitCode 上传逻辑保留为「可选冗余」：仅当仓库配置了 RUSTCODE_RELEASE_ACCESS_TOKEN
# 等 GitCode Secret（RUSTCODE_RELEASE_ACCESS_TOKEN / _API_HOST / _OWNER）时才执行；
# 未配置时跳过，不影响 GitHub Release 的创建。
#
# 前置：推送形如 vX.Y.Z 的 Tag（或手动 workflow_dispatch）才会触发本流水线。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    runs-on: macos-latest
    # GitCode 冗余发布凭据：先落到 job 级 env，供步骤 if 里的 env.* 判断使用
    # （GitHub Actions 的 secrets 上下文在 if 中不可用，必须经 env 中转）。
    env:
      RUSTCODE_RELEASE_ACCESS_TOKEN: ${{ secrets.RUSTCODE_RELEASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node (build embedded webui)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build webui
        run: |
          cd webui && npm ci && npm run build && cd ..

      - name: Add macOS targets
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Build (CLI embeds webui via rustcode-daemon)
        run: |
          cargo build --release -p rustcode --target aarch64-apple-darwin
          cargo build --release -p rustcode --target x86_64-apple-darwin

      - name: Package
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/rustcode dist/rustcode-${TAG_NAME}-darwin-arm64
          cp target/x86_64-apple-darwin/release/rustcode dist/rustcode-${TAG_NAME}-darwin-x64
          chmod +x dist/*
          strip dist/rustcode-${TAG_NAME}-darwin-arm64 || true
          strip dist/rustcode-${TAG_NAME}-darwin-x64 || true
          tar -czf dist/rustcode-${TAG_NAME}-darwin-arm64.tar.gz -C dist rustcode-${TAG_NAME}-darwin-arm64
          tar -czf dist/rustcode-${TAG_NAME}-darwin-x64.tar.gz -C dist rustcode-${TAG_NAME}-darwin-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          # 同时上传裸二进制：资产名与 release/ 目录、scripts/install.sh 期望的
          # `rustcode-<version>-<os>-<arch>` 一致，安装脚本才能以本 Release 为下载源。
          path: |
            dist/*.tar.gz
            dist/rustcode-*-darwin-arm64
            dist/rustcode-*-darwin-x64

      - name: Upload to GitCode (optional, needs secrets)
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.RUSTCODE_RELEASE_ACCESS_TOKEN != '' }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          python3 .github/workflows/create_tag_release.py \
            --tag-name=${TAG_NAME} \
            --file-name=rustcode-${TAG_NAME}-darwin-arm64 \
            --file-path=dist/rustcode-${TAG_NAME}-darwin-arm64 \
            --access-token="${RUSTCODE_RELEASE_ACCESS_TOKEN}"
          python3 .github/workflows/create_tag_release.py \
            --tag-name=${TAG_NAME} \
            --file-name=rustcode-${TAG_NAME}-darwin-x64 \
            --file-path=dist/rustcode-${TAG_NAME}-darwin-x64 \
            --access-token="${RUSTCODE_RELEASE_ACCESS_TOKEN}"

  build-linux:
    runs-on: ubuntu-latest
    # GitCode 冗余发布凭据（见 build-macos 说明）。
    env:
      RUSTCODE_RELEASE_ACCESS_TOKEN: ${{ secrets.RUSTCODE_RELEASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node (build embedded webui)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build webui
        run: |
          cd webui && npm ci && npm run build && cd ..

      - name: Install musl toolchain
        run: |
          # x86_64 musl: the distro package is enough (it provides musl-gcc).
          # xz-utils is needed to unpack the aarch64 toolchain archive.
          sudo apt-get update
          sudo apt-get install -y musl-tools xz-utils

          # aarch64 musl: Ubuntu ships no aarch64 musl cross gcc, and the glibc
          # cross gcc is NOT a substitute -- the C dependencies (tree-sitter,
          # zstd) would then be compiled against glibc headers and fail to link
          # against musl libc (undefined __memcpy_chk / __fprintf_chk references).
          #
          # The pinned source (cross-tools/musl-cross GitHub Release, pinned by
          # tag + sha256, replacing the dead musl.cc host) and the downstream
          # linker / cc / ar / strip paths live in the script below, which
          # scripts/cross-build.sh calls too -- one pin, two callers, no drift.
          bash scripts/install-musl-cross.sh --github-env

      - name: Add Linux targets
        run: |
          rustup target add x86_64-unknown-linux-musl
          rustup target add aarch64-unknown-linux-musl

      - name: Build (CLI embeds webui via rustcode-daemon)
        env:
          # The aarch64 musl linker / cc / ar come from the "Install musl
          # toolchain" step via $GITHUB_ENV, so the toolchain paths live in one
          # place only. musl-gcc is on PATH from the distro package.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          cargo build --release -p rustcode --target x86_64-unknown-linux-musl
          cargo build --release -p rustcode --target aarch64-unknown-linux-musl

      - name: Package
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/rustcode dist/rustcode-${TAG_NAME}-linux-x64
          cp target/aarch64-unknown-linux-musl/release/rustcode dist/rustcode-${TAG_NAME}-linux-arm64
          chmod +x dist/*
          strip dist/rustcode-${TAG_NAME}-linux-x64
          "$MUSL_AARCH64_STRIP" dist/rustcode-${TAG_NAME}-linux-arm64
          tar -czf dist/rustcode-${TAG_NAME}-linux-x64.tar.gz -C dist rustcode-${TAG_NAME}-linux-x64
          tar -czf dist/rustcode-${TAG_NAME}-linux-arm64.tar.gz -C dist rustcode-${TAG_NAME}-linux-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          # 裸二进制同 macOS：与 install.sh 的下载路径同名同格式。
          path: |
            dist/*.tar.gz
            dist/rustcode-*-linux-x64
            dist/rustcode-*-linux-arm64

      - name: Upload to GitCode (optional, needs secrets)
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.RUSTCODE_RELEASE_ACCESS_TOKEN != '' }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          python3 .github/workflows/create_tag_release.py \
            --tag-name=${TAG_NAME} \
            --file-name=rustcode-${TAG_NAME}-linux-x64 \
            --file-path=dist/rustcode-${TAG_NAME}-linux-x64 \
            --access-token="${RUSTCODE_RELEASE_ACCESS_TOKEN}"
          python3 .github/workflows/create_tag_release.py \
            --tag-name=${TAG_NAME} \
            --file-name=rustcode-${TAG_NAME}-linux-arm64 \
            --file-path=dist/rustcode-${TAG_NAME}-linux-arm64 \
            --access-token="${RUSTCODE_RELEASE_ACCESS_TOKEN}"

  build-windows:
    runs-on: windows-latest
    # GitCode 冗余发布凭据（见 build-macos 说明）。
    env:
      RUSTCODE_RELEASE_ACCESS_TOKEN: ${{ secrets.RUSTCODE_RELEASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node (build embedded webui)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build webui
        shell: bash
        run: |
          cd webui && npm ci && npm run build && cd ..

      - name: Add Windows targets
        run: |
          rustup target add aarch64-pc-windows-msvc
          rustup target add x86_64-pc-windows-msvc

      - name: Build (CLI embeds webui via rustcode-daemon)
        shell: bash
        run: |
          cargo build --release -p rustcode --target aarch64-pc-windows-msvc
          cargo build --release -p rustcode --target x86_64-pc-windows-msvc

      - name: Package
        shell: bash
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p dist
          cp target/aarch64-pc-windows-msvc/release/rustcode.exe dist/rustcode-${TAG_NAME}-windows-arm64.exe
          cp target/x86_64-pc-windows-msvc/release/rustcode.exe dist/rustcode-${TAG_NAME}-windows-x64.exe
          cd dist
          tar -czf rustcode-${TAG_NAME}-windows-arm64.tar.gz rustcode-${TAG_NAME}-windows-arm64.exe
          tar -czf rustcode-${TAG_NAME}-windows-x64.tar.gz rustcode-${TAG_NAME}-windows-x64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          # 裸 .exe 同 macOS/Linux（打包阶段已 cd 到 dist，故此处路径相对仓库根）。
          path: |
            dist/*.tar.gz
            dist/rustcode-*-windows-x64.exe
            dist/rustcode-*-windows-arm64.exe

      - name: Upload to GitCode (optional, needs secrets)
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.RUSTCODE_RELEASE_ACCESS_TOKEN != '' }}
        shell: bash
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          python3 .github/workflows/create_tag_release.py \
            --tag-name=${TAG_NAME} \
            --file-name=rustcode-${TAG_NAME}-windows-arm64.exe \
            --file-path=dist/rustcode-${TAG_NAME}-windows-arm64.exe \
            --access-token="${RUSTCODE_RELEASE_ACCESS_TOKEN}"
          python3 .github/workflows/create_tag_release.py \
            --tag-name=${TAG_NAME} \
            --file-name=rustcode-${TAG_NAME}-windows-x64.exe \
            --file-path=dist/rustcode-${TAG_NAME}-windows-x64.exe \
            --access-token="${RUSTCODE_RELEASE_ACCESS_TOKEN}"

  github-release:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > sha256sums.txt
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 保留：distro-pm 特性门禁（与发布无关，仅验证 feature 可构建/测试）。
  distro-pm-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build with distro-pm feature
        run: cargo build -p rustcode --features distro-pm

      - name: Test distro-pm gating
        run: cargo test -p rustcode-updater --lib --features distro-pm
