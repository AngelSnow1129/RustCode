# RustCode daemon 配置模板。
# 填入你自己的第三方服务商（OpenAI 兼容接口）信息：base_url / api_key / model。
# 也可使用环境变量：api_key = "env:RUSTCODE_API_KEY"。
default_provider = "my-provider"

[providers.my-provider]
type = "openai"
api_key = "sk-your-api-key"
model = "your-model-id"
base_url = "https://api.example.com/v1"
context_window = 16000

# 免密访问 webui（可选，默认 false = 需要 token / 访问密钥）。
# 打开后受保护路由不再校验 Bearer token 与 Cookie，浏览器打开即用。
# 优先级：环境变量 RUSTCODE_WEBUI_NO_AUTH > 命令行 --no-auth > 本配置
# （环境变量 =0 可强制关闭、压住下面这项）。不支持热加载，改后需重启。
# 免密 = 该端口上全部能力（含 shell 工具）对任何能连到它的人开放，
# 仅在可信网络开启；容器内 --host 0.0.0.0 等同于对宿主局域网开放，慎开。
# /tunnel（经中继暴露到公网）刻意不受本开关影响，始终要求 token。
# webui_no_auth = false
