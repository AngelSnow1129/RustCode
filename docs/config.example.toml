# =============================================================================
# RustCode 配置模板
#
# 复制到 ~/.rustcode/config.toml 后按需修改。Provider 可声明多个，
# 在 TUI 中用 /provider 或 /model 切换。
# =============================================================================

# ---- 默认 provider（必须匹配下方某个 [providers.*] 的键名）----
default_provider = "deepseek"

# ---- UI / 提示词语言（默认中文，可改为 "en"）----
# 省略 = 自动检测（LC_ALL/LC_MESSAGES/LANG；LANG=C/POSIX 视为无偏好 -> 中文）。
# language = "zh_CN"

# ---- 自动更新 / 自动提交（顶层键，必须在任何 [表] 之前）----
# auto_update: 每小时轮询新版本并预暂存，下次启动时应用（/upgrade 仍可手动）
# auto_commit: 每轮 agent 结束后自动提交改动的文件（仅在 git 仓库内生效）
auto_update = true
auto_commit = false

# ---- 离线 / 内网无公网环境开关（顶层键）----
# offline_mode: 离线 / 内网无公网环境开关。
#   "off"  (默认) — 正常联网行为，一切不变。
#   "on"   — 移除 web_fetch/web_search、停用自动更新等所有出站网络行为，并告知模型处于离线环境
#            （优先离线友好写法：不引外部 CDN、不做联网安装）。
#   "auto" — 乐观联网；观察到一次联网失败后自动转为离线。
# 环境变量 RUSTCODE_OFFLINE=1|0|auto 覆盖此项（优先级更高）。
offline_mode = "off"

# offline_note (可选): 声明本机内网可用的镜像/私服，会拼接进离线系统提示，
# 让模型知道哪些私服可用（如 npm 私服），避免过度保守。留空则不拼接。
# offline_note = "npm 私服 registry=http://nexus.internal:8081（可正常 npm install）；Maven 走内部仓库；pip index 已配"

# =============================================================================
# 静态访问密钥（IDE / webui 客户端 Bearer 鉴权）
# =============================================================================
# daemon 启动时将其注册为有效 Bearer token（对应前端读取 daemon-<port>.json
# 的鉴权方式），取代/补充一次性随机 token。IDE / webui 客户端随后以
# `Authorization: Bearer <key>` 方式鉴权。
# 优先级：环境变量 RUSTCODE_ACCESS_KEY > 本配置 > 历史别名 RUSTCODE_DAEMON_TOKEN。
# 修改后需重启 daemon 才能生效（不支持热加载，与 RUSTCODE_DAEMON_TOKEN 一致）。
# access_key = "替换为你的强随机密钥"

# =============================================================================
# 远程访问隧道（frp 风格反向隧道，env 驱动，非 config.toml 字段）
# =============================================================================
# 将本地 webui / HTTP·SSE API 经可配置中继暴露到公网。仅由环境变量控制，
# 不在 config.toml 里设键（与 endpoints.rs 设计一致）：
#
#   RUSTCODE_ENABLE_TUNNEL=1            # 开启隧道（默认关闭）
#   RUSTCODE_TUNNEL_RELAY=wss://your-relay.example.com   # 中继地址
#
# 注：内置 WebSocket 隧道客户端（frp 的 frpc 半边：连中继 → 用隧道 token 鉴权 →
# 把中继侧入站流量转发到本地端点）目前【设计已定、尚未实现】。协议为带 stream id
# 的 Open / Data / Close 帧，可据此独立实现中继。
# 现阶段远程接入请用下面的 `/tunnel lan`（同网直连），或用自己的 frp / 外部客户端
# 指向 /tunnel 打印的本地回源端口。
#
# 不想用中继时，用 `/tunnel lan` 把隧道端点绑定到 0.0.0.0，同一局域网内的设备即可
# 直连（无需中继、无需额外依赖，建议在可信网络下使用）；不带子命令的 /tunnel 仍
# 绑定回环地址，仅本机可达。/tunnel 的子命令：lan、stop。
#
# 远程客户端以 `Authorization: Bearer <access_key>` 鉴权（与上方 access_key 同一套密钥）。
# 在 TUI 内执行 /tunnel 启动本地隧道端点并打印中继 URL + access_key + 本地端口。
# 该隧道取代已移除的移动端 App 远程访问，无托管账号或移动端依赖。

# =============================================================================
# Provider 示例
# =============================================================================

# -------- DeepSeek ----------
[providers.deepseek]
type = "openai"
api_key = "sk-..."
model = "deepseek-chat"
base_url = "https://api.deepseek.com/v1"
context_window = 64000
# Total attempts including the first request. Default: 3; set 1 to disable retries.
# retry_max_attempts = 5

# -------- 每 provider 的 HTTP 超时（三个预算互不替代；单位：秒）--------
# 全部可选，未设置时沿用适配器默认值（connect 30 / request 90 / idle 120）。
# 注意 `idle` 也覆盖首字节等待；长思考模型在大 prompt 后会静默很久，
# 把它调小会在模型"思考中"被误判为流超时。
[providers.deepseek.timeout]
# connect = 10     # TCP + TLS 握手到首字节，防死网关/黑洞代理
# request = 600    # OPEN 阶段整体预算（openai / anthropic 有效；ollama 无此接缝）
# idle    = 300    # 流内字节空闲上限，同时是首 token 等待

# DeepSeek V4 专属：推理历史回显策略
# (unset = auto-detect: deepseek-v4* → include, deepseek-reasoner/r1 → exclude)
# reasoning_history = "include"  # 或 "exclude"
# reasoning_effort = "high"

# -------- 智谱 GLM-5.2（通过 Zhipu API）----------
[providers.glm]
type = "openai"
api_key = "sk-..."
model = "glm-5.2"
base_url = "https://open.bigmodel.cn/api/paas/v4"
context_window = 1000000
max_tokens = 131072

# 推理强度调节（high / max）
# 参考：https://docs.z.ai/guides/llm/glm-5.2

