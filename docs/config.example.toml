# =============================================================================
# 多 provider 切换快捷键
# =============================================================================
# 在 TUI 中输入 /provider 打开 provider 管理界面
# 输入 /model 在当前 provider 下切换模型

# =============================================================================
# 数据日志（每轮对话写入 Markdown 摘要 + 每次 LLM 请求 JSONL）
# 日志包含未经脱敏的提示词、响应、工具输入和输出，请按敏感数据保护。
# =============================================================================
[datalog]
enabled = false
dir = "~/.rustcode/datalog"

# =============================================================================
# 通知
# =============================================================================
[notifications]
enabled = true
min_duration_secs = 8
terminal = true
system = true
bell = true
background_only = true

# =============================================================================
# 网络代理
# =============================================================================
[network.proxy]
# follow_system (default): respect the launch environment / system proxy.
# default_proxy: pin the values below. no_proxy: bypass all proxies.
mode = "follow_system"
# http = "http://127.0.0.1:7890"
# https = "http://127.0.0.1:7890"
# all = "socks5://127.0.0.1:7890"
# no_proxy = "localhost,127.0.0.1"

# Lifecycle hooks — run custom scripts on key events.
# Hooks are NOT configured in this file. Use separate config files instead:
#   TOML: ~/.rustcode/hooks/hooks.toml (recommended, supports ScriptHook + Webhook)
#   JSON: ~/.rustcode/hooks.json (CC-compatible, lightweight)
# See docs/hooks.md for full reference.
#
# Available events (JSON CC format; TOML ScriptHook uses different trigger names — see docs/hooks.md):
#   pre_tool_use    — before each tool call (can block via stdout {"action":"block","reason":"..."})
#   post_tool_use   — after each tool call
#   user_prompt_submit — when the user submits a prompt (can block via stdout {"decision":"block","reason":"..."} or inject context via {"hookSpecificOutput":{"additionalContext":"..."}})
#   session_start   — when a new session begins
#   session_end     — when a session ends
#
# JSON CC scripts receive context via env vars: RUSTCODE_HOOK_EVENT, RUSTCODE_TOOL_NAME,
# RUSTCODE_HOOK_CONTEXT (JSON string). TOML ScriptHook uses stdin instead — see docs/hooks.md.
# JSON CC PreToolUse stdout supports (TOML ScriptHook uses text protocol ok/deny:/modify: — see docs/hooks.md):
#   {"action":"allow"} or {"action":"block","reason":"..."} or {"action":"modify","args":{...}}
#
# Example ~/.rustcode/hooks.json (JSON CC format; TOML uses [[hooks]] with trigger/script/timeout_secs — see docs/hooks.md):
# {
#   "hooks": {
#     "verify-gate": {
#       "event": "post_tool_use",
#       "command": "python ~/.rustcode/scripts/verify-gate.py",  # ~ 不会自动展开，需用绝对路径（如 C:\Users\you\.rustcode\scripts\verify-gate.py 或 /home/you/.rustcode/scripts/verify-gate.py）
#       "timeout_ms": 30000  # default is 10000 (10s); set 30s here because verify may be slow
#     }
#   }
# }

# =============================================================================
# 自托管 / 自定义 OpenAI / Anthropic 兼容端点（平台中立，零遥测）
# =============================================================================
# 本 fork 已移除所有遥测，并将 LLM 客户端完全解耦：你可以用任意自托管或
# 第三方 OpenAI / Anthropic 兼容网关，只需指定 base_url。网关签名仅在
# base_url 命中已配置的网关时才会附加，其它端点一律使用普通 bearer 鉴权。
#
# 自定义 OpenAI 兼容端点：
[providers.my-openai-gw]
type = "openai-compatible"
api_key = "env:MY_OPENAI_KEY"   # 从环境变量读取，切勿硬编码
model = "gpt-4o"
base_url = "https://my-gateway.example.com/v1"
# 自定义请求头（自托管网关的鉴权 / 租户头，仅来自配置，绝不硬编码）
extra_headers = { "X-Tenant" = "acme" }
# 仅对该 provider 生效的转发代理（可选）
# proxy = "http://corp-proxy:3128"
skip_tls_verify = false

# 自定义 Anthropic 兼容端点：
[providers.my-anthropic-gw]
type = "anthropic-compatible"
api_key = "env:MY_ANTHROPIC_KEY"
model = "claude-opus-4"
base_url = "https://my-anthropic-gw.example.com"

# 扩展思考（Anthropic extended thinking）：开关 / 预算 / 保留
# thinking_enabled = true
# thinking_type   = "enabled"      # 或 "disabled"
# thinking_budget = 10000          # 思考 token 预算
# thinking_keep   = "all"          # 保留思考块: all / none / summary

# 模型名映射：把请求里的模型名映射到上游真实模型名（未列出的恒等映射）
# [providers.my-anthropic-gw.model_mapping]
# "claude-sonnet" = "claude-sonnet-4-6"
# "claude-opus"   = "claude-opus-4"

# api_key 环境变量展开三种形式（切勿硬编码真实 key）：
#   api_key = "$MY_KEY"              # $VAR 形式
#   api_key = "${MY_KEY}"            # ${VAR} 形式
#   api_key = "${MY_KEY:-fallback}"  # ${VAR:-default}，VAR 未设时用 fallback

# =============================================================================
# Agent 循环保险（环境变量）
# =============================================================================
# 普通 coding 回合默认不设模型轮次上限；精确无进展防护仍然生效。
# 无人值守或成本敏感的部署可显式设置额外的变化型 runaway 高水位：
#   RUSTCODE_TURN_MAX_ROUNDS=200
# 精确无进展防护比较“实际工具名 + 规范化参数 + 有效 cwd + 模型可见结果 + 错误状态”；
# 默认第 3 次提醒、第 4 次完成真实工具结果后停止。合法任务若明确需要重复相同调用和
# 相同结果，可提高这两个阈值；STOP 设为 0 可关闭：
#   RUSTCODE_TOOL_LOOP_WARNING_THRESHOLD=3
#   RUSTCODE_TOOL_LOOP_STOP_THRESHOLD=4
# goal 另有独立轮次上限（无套餐信息时默认 300 轮，会按套餐调用额度调整）；
# 墙钟上限默认关闭。二者设为 0 均表示不设上限：
#   RUSTCODE_GOAL_MAX_ROUNDS=300
#   RUSTCODE_GOAL_MAX_DURATION_SECS=0
# /loop 使用 [loop_config] 的 max_rounds，并可由 RUSTCODE_LOOP_MAX_ROUNDS 覆盖；0 表示不设上限。
# 内嵌 code_review 在父回合等待期间有自己的默认保险（200 轮/900 秒），均可覆盖，0 为关闭：
#   RUSTCODE_REVIEW_MAX_ROUNDS=200
#   RUSTCODE_REVIEW_MAX_DURATION_SECS=900
[coding]
max_rounds = 0

[loop_config]
max_rounds = 100

# Todo 任务跟踪。RUSTCODE_TODO 环境变量仍可覆盖 enabled；修改 enabled 后需重启当前 runtime。
# eager: auto（DeepSeek V4 Flash 自动增强）| preferred（复杂任务优先提醒）| always（provider 支持时强制先建表）
[tools.todo]
enabled = true
eager = "auto"

# =============================================================================
# Subagent 设置（`task` 工具：主 agent 把子任务派发给隔离上下文的子 agent）
# =============================================================================
# 总开关是环境变量 RUSTCODE_SUBAGENT（默认开启）——用 `RUSTCODE_SUBAGENT=0` 关闭。
# 下面的 `enabled` 字段是历史遗留、当前不生效；真正开关看上面的环境变量。
# 生效旋钮：max_concurrent（并发数）和 max_rounds（单任务模型轮次高水位）。
# timeout_secs 仅为兼容旧配置保留，不再限制 subagent 的总运行时间。
# max_rounds 可由 RUSTCODE_SUBAGENT_MAX_ROUNDS 覆盖。
[subagent]
enabled = true          # 遗留字段，不生效（改这个不会关掉 subagent；用 RUSTCODE_SUBAGENT=0）
initial_turns = 4       # 遗留字段，不生效
max_turns = 12          # 遗留字段，不生效
max_concurrent = 3      # 生效：并发子 agent 上限（下限 1）
timeout_secs = 900      # 遗留字段：仍可解析，但不生效
max_rounds = 200        # 生效：单个子任务模型轮次高水位（0=不设上限；继承上面的精确防护策略）

# 便捷开关（默认 off）。设为 "read-only" / "accept-edits" / "auto" 即挂载对应工具。
# 多实例 / 模型覆盖 / bypass 权限请用 [[subagent.external]]。
# codex = "off"
# claude = "off"

# =============================================================================
# 多 Agent 并行模板（专业化分工 + 并行处理 + 独立验证）
# =============================================================================
# 取消注释即可启用 3 角色并行：探索者（只读）、实现者（可写）、审查者（只读验证）。
# max_concurrent 提到 4 以容纳 3 角色 + 1 备用槽。便捷开关保持 off，用 external 实例。
#
# [subagent]
# max_concurrent = 4
# max_rounds = 200
#
# # 探索者（只读，低成本模型）
# [[subagent.external]]
# name = "explorer"
# kind = "codex"
# permission = "read-only"
#
# # 实现者（可写，强模型）
# [[subagent.external]]
# name = "builder"
# kind = "claude-code"
# permission = "accept-edits"
#
# # 审查者（只读，独立验证——不信任实现者的输出）
# [[subagent.external]]
# name = "reviewer"
# kind = "codex"
# permission = "read-only"

# =============================================================================
# LSP（语言服务器协议）
# =============================================================================
[lsp]
enabled = false
auto_detect = false
diagnostics_settle_delay_ms = 150

# =============================================================================
# 插件
# =============================================================================
[plugin]
auto_install_default_skills = true
auto_update_marketplaces = true

# =============================================================================
# UI
# =============================================================================
[ui]
theme = "auto"
# /resume 初次回放到终端原生 scrollback 的视觉行上限。
# 省略时按终端自动选择；0 表示完整回放（长会话恢复会更慢）。
# history_replay_max_rows = 5000
