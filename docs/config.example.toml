# =============================================================================
# RustCode 配置模板
#
# 复制到 ~/.rustcode/config.toml 后按需修改。Provider 可声明多个，
# 在 TUI 中用 /provider 或 /model 切换。
# =============================================================================

# ---- 默认 provider（必须匹配下方某个 [providers.*] 的键名）----
default_provider = "deepseek"

# ---- UI / 提示词语言（默认中文，可改为 "en"）----
# 省略 = 自动检测（LC_ALL/LC_MESSAGES/LANG；LANG=C/POSIX 视为无偏好 -> 中文）。
# language = "zh_CN"

# ---- 自动更新 / 自动提交（顶层键，必须在任何 [表] 之前）----
# auto_update: 每小时轮询新版本并预暂存，下次启动时应用（/upgrade 仍可手动）
# auto_commit: 每轮 agent 结束后自动提交改动的文件（仅在 git 仓库内生效）
auto_update = true
auto_commit = false

# ---- 离线 / 内网无公网环境开关（顶层键）----
# offline_mode: 离线 / 内网无公网环境开关。
#   "off"  (默认) — 正常联网行为，一切不变。
#   "on"   — 移除 web_fetch/web_search，停用遥测与自动更新，并告知模型处于离线环境
#            （优先离线友好写法：不引外部 CDN、不做联网安装）。
#   "auto" — 乐观联网；观察到一次联网失败后自动转为离线。
# 环境变量 RUSTCODE_OFFLINE=1|0|auto 覆盖此项（优先级更高）。
offline_mode = "off"

# offline_note (可选): 声明本机内网可用的镜像/私服，会拼接进离线系统提示，
# 让模型知道哪些私服可用（如 npm 私服），避免过度保守。留空则不拼接。
# offline_note = "npm 私服 registry=http://nexus.internal:8081（可正常 npm install）；Maven 走内部仓库；pip index 已配"

# =============================================================================
# Provider 示例
# =============================================================================

# ─── Example: CodingPlan gateway (recommended) ───
# Run `rustcode login` to auto-configure via OAuth, which writes
# providers like the one below. Manual setup is for reference only.
#
# [providers.RustCode-deepseek-v4-flash]
# type = "openai"
# api_key = "<your-codingplan-api-key>"
# model = "deepseek-v4-flash"
# base_url = "https://gateway.example.com/v1"
# context_window = 1000000
#
# [providers.RustCode-Qwen-Qwen3-VL-8B-Instruct]
# type = "openai"
# api_key = "<your-codingplan-api-key>"
# model = "Qwen/Qwen3-VL-8B-Instruct"
# base_url = "https://gateway.example.com/v1"
# context_window = 64000
# ─────────────────────────────────────────────────

# -------- DeepSeek ----------
[providers.deepseek]
type = "openai"
api_key = "sk-..."
model = "deepseek-chat"
base_url = "https://api.deepseek.com/v1"
context_window = 64000
# Total attempts including the first request. Default: 3; set 1 to disable retries.
# retry_max_attempts = 5

# -------- 每 provider 的 HTTP 超时（三个预算互不替代；单位：秒）--------
# 全部可选，未设置时沿用适配器默认值（connect 30 / request 90 / idle 120）。
# 注意 `idle` 也覆盖首字节等待；长思考模型在大 prompt 后会静默很久，
# 把它调小会在模型"思考中"被误判为流超时。
[providers.deepseek.timeout]
# connect = 10     # TCP + TLS 握手到首字节，防死网关/黑洞代理
# request = 600    # OPEN 阶段整体预算（openai / anthropic 有效；ollama 无此接缝）
# idle    = 300    # 流内字节空闲上限，同时是首 token 等待

# DeepSeek V4 专属：推理历史回显策略
# (unset = auto-detect: deepseek-v4* → include, deepseek-reasoner/r1 → exclude)
# reasoning_history = "include"  # 或 "exclude"
# reasoning_effort = "high"

# -------- 智谱 GLM-5.2（通过 Zhipu API）----------
